# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

dotenv: [".env"]

vars:
  BINARY: mnemoir
  BIN_DIR: bin
  # Windows executables require the .exe suffix or Node-spawned MCP clients
  # (Claude Code) cannot launch the binary. Empty on POSIX.
  BIN_EXT: '{{ternary ".exe" "" (eq OS "windows")}}'
  CMD_DIR: ./cmd/mnemoir
  # On Windows PowerShell $HOME is empty (it sets USERPROFILE); fall back to it
  # and normalize backslashes so the path works in bash, gosh, and the binary.
  HOME_DIR: '{{if .HOME}}{{.HOME}}{{else}}{{.USERPROFILE | replace "\\" "/"}}{{end}}'
  CONFIG_DIR: "{{.HOME_DIR}}/.mnemoir"
  REDIS_UI_URL: "http://localhost:8001"
  # Force Git Bash on Windows: a bare `bash` resolves to WSL bash, which cannot
  # see Windows .exe tools (jq.exe) and mangles $HOME. Override with MNEMOIR_BASH.
  BASH: '{{.MNEMOIR_BASH | default (ternary "C:/Program Files/Git/bin/bash.exe" "bash" (eq OS "windows"))}}'

tasks:
  default:
    silent: true
    cmds:
      - task --list

  # ---------------------------------------------------------------------------
  # Build
  # ---------------------------------------------------------------------------
  build:
    desc: Build binary for current OS/ARCH
    cmds:
      - CGO_ENABLED=0 go build -o {{.BIN_DIR}}/{{.BINARY}}{{.BIN_EXT}} {{.CMD_DIR}}

  build:all:
    desc: Cross-compile for all supported platforms
    deps:
      - build:darwin-arm64
      - build:darwin-amd64
      - build:linux-amd64
      - build:windows-amd64

  build:darwin-arm64:
    desc: Build for macOS Apple Silicon
    cmds:
      - task: build:cross
        vars: { GOOS: darwin, GOARCH: arm64 }

  build:darwin-amd64:
    desc: Build for macOS Intel
    cmds:
      - task: build:cross
        vars: { GOOS: darwin, GOARCH: amd64 }

  build:linux-amd64:
    desc: Build for Linux x86_64
    cmds:
      - task: build:cross
        vars: { GOOS: linux, GOARCH: amd64 }

  build:windows-amd64:
    desc: Build for Windows x86_64
    cmds:
      - task: build:cross
        vars: { GOOS: windows, GOARCH: amd64, EXT: .exe }

  build:cross:
    internal: true
    cmds:
      - "CGO_ENABLED=0 GOOS={{.GOOS}} GOARCH={{.GOARCH}} go build -o {{.BIN_DIR}}/{{.BINARY}}-{{.GOOS}}-{{.GOARCH}}{{.EXT}} {{.CMD_DIR}}"

  # ---------------------------------------------------------------------------
  # Core
  # ---------------------------------------------------------------------------
  install:
    desc: Install binary to $GOPATH/bin
    cmds:
      - go install {{.CMD_DIR}}

  uninstall:
    desc: Remove binary, MCP registrations, hooks, specs, and config
    cmds:
      - echo "Removing binary from GOPATH..."
      - rm -f $(go env GOPATH)/bin/{{.BINARY}}{{.BIN_EXT}}
      - echo "Removing claude MCP registration (all scopes)..."
      - claude mcp remove {{.BINARY}} -s user 2>/dev/null || true
      - claude mcp remove {{.BINARY}} -s local 2>/dev/null || true
      - claude mcp remove {{.BINARY}} -s project 2>/dev/null || true
      - echo "Removing claude SessionEnd hook..."
      - '"{{.BASH}}" ./scripts/uninstall-hook.sh 2>/dev/null || true'
      - echo "Removing agent specs from ~/.claude/..."
      - '"{{.BASH}}" ./scripts/uninstall-specs.sh 2>/dev/null || true'
      - echo "Removing Codex CLI MCP registration..."
      - '"{{.BASH}}" ./scripts/uninstall-mcp-codex.sh 2>/dev/null || true'
      - echo "Removing Codex CLI Stop hook..."
      - '"{{.BASH}}" ./scripts/uninstall-hook-codex.sh 2>/dev/null || true'
      - echo "Removing agent specs from ~/.codex/..."
      - '"{{.BASH}}" ./scripts/uninstall-specs-codex.sh 2>/dev/null || true'
      - echo "Removing config directory {{.CONFIG_DIR}}..."
      - rm -rf "{{.CONFIG_DIR}}"
      - echo "Removing build artifacts..."
      - rm -rf {{.BIN_DIR}}
      - echo "mnemoir uninstalled."

  test:
    desc: Run all tests
    cmds:
      - go test ./...

  # ---------------------------------------------------------------------------
  # Docker / Redis
  # ---------------------------------------------------------------------------
  docker:up:
    desc: Start Redis Stack (Redis + RedisInsight)
    cmds:
      - docker compose up -d

  docker:down:
    desc: Stop Redis Stack
    cmds:
      - docker compose down

  redis:ui:
    desc: Open RedisInsight web UI
    cmds:
      - echo "Opening RedisInsight at {{.REDIS_UI_URL}}"
      - "open {{.REDIS_UI_URL}} || xdg-open {{.REDIS_UI_URL}} || start {{.REDIS_UI_URL}} || echo 'Please open {{.REDIS_UI_URL}} manually'"

  # ---------------------------------------------------------------------------
  # Claude
  # ---------------------------------------------------------------------------
  setup:
    desc: Full install for claude (docker + build + config + MCP + hook + specs)
    deps:
      - docker:up
      - build
    cmds:
      - mkdir -p "{{.CONFIG_DIR}}" && chmod 700 "{{.CONFIG_DIR}}"
      - |
        if [ ! -f "{{.CONFIG_DIR}}/config.toml" ]; then
          cp config/default.toml "{{.CONFIG_DIR}}/config.toml"
          chmod 600 "{{.CONFIG_DIR}}/config.toml"
          echo "Config copied to {{.CONFIG_DIR}}/config.toml"
        else
          echo "Config already exists at {{.CONFIG_DIR}}/config.toml"
        fi
      - |
        if [ -z "$MNEMOIR_REDIS_PASSWORD" ]; then
          echo "WARNING: MNEMOIR_REDIS_PASSWORD is not set. Set it before starting Redis."
        fi
      - task: prewarm
      - |
        if command -v claude >/dev/null 2>&1; then
          task mcp:global
          task hook
          task specs
        else
          echo "Claude CLI not found; skipping Claude MCP, hook, and specs setup."
          echo "For Pi, run 'task mcp:wrapper' and use the wrapper path documented in README.md."
        fi
      - echo ""
      - echo "Setup complete. Edit {{.CONFIG_DIR}}/config.toml to customize."

  prewarm:
    desc: Download and initialize the configured local embedding model
    deps: [build]
    preconditions:
      - sh: '[ -f "{{.CONFIG_DIR}}/config.toml" ]'
        msg: "Config not found at {{.CONFIG_DIR}}/config.toml. Run setup first or create it manually."
    cmds:
      - '"{{.ROOT_DIR}}/{{.BIN_DIR}}/{{.BINARY}}{{.BIN_EXT}}" prewarm --config "{{.CONFIG_DIR}}/config.toml"'

  mcp:wrapper:
    desc: Install a Linux/macOS MCP launcher that loads mnemoir env before exec
    deps: [build]
    cmds:
      - '"{{.BASH}}" ./scripts/install-mcp-wrapper.sh'

  mcp:local:
    desc: |
      Register MCP server in claude project-local scope (cwd-bound).
      WARNING: local scope takes precedence over user scope in Claude Code.
      Do not combine with mcp:global on the same host or the local entry
      will shadow the global one silently. Prefer mcp:global.
    deps: [build]
    preconditions:
      - sh: '[ -n "$MNEMOIR_REDIS_PASSWORD" ]'
        msg: "MNEMOIR_REDIS_PASSWORD is not set. Set it in .env or export it."
    cmds:
      - claude mcp remove {{.BINARY}} -s local 2>/dev/null || true
      - 'claude mcp add {{.BINARY}} -s local -t stdio -e MNEMOIR_REDIS_PASSWORD="$MNEMOIR_REDIS_PASSWORD" -e MNEMOIR_CONFIG="{{.CONFIG_DIR}}/config.toml" -- {{.ROOT_DIR}}/{{.BIN_DIR}}/{{.BINARY}}{{.BIN_EXT}}'

  mcp:global:
    desc: Register MCP server globally (all claude projects). Also purges any local/project scope entry so it cannot shadow the global one.
    deps: [build]
    preconditions:
      - sh: '[ -n "$MNEMOIR_REDIS_PASSWORD" ]'
        msg: "MNEMOIR_REDIS_PASSWORD is not set. Set it in .env or export it."
    cmds:
      - claude mcp remove {{.BINARY}} -s user 2>/dev/null || true
      - claude mcp remove {{.BINARY}} -s local 2>/dev/null || true
      - claude mcp remove {{.BINARY}} -s project 2>/dev/null || true
      - 'claude mcp add {{.BINARY}} -s user -t stdio -e MNEMOIR_REDIS_PASSWORD="$MNEMOIR_REDIS_PASSWORD" -e MNEMOIR_CONFIG="{{.CONFIG_DIR}}/config.toml" -- {{.ROOT_DIR}}/{{.BIN_DIR}}/{{.BINARY}}{{.BIN_EXT}}'

  hook:
    desc: Install claude SessionEnd hook
    cmds:
      - '"{{.BASH}}" ./scripts/install-hook.sh {{.ROOT_DIR}}/scripts/session-end-hook.sh'

  specs:
    desc: Install agent specs into ~/.claude/memory/
    cmds:
      - '"{{.BASH}}" ./scripts/install-specs.sh {{.ROOT_DIR}}/docs/agent-specs.md'

  # ---------------------------------------------------------------------------
  # Codex
  # ---------------------------------------------------------------------------
  setup:codex:
    desc: Full install for Codex CLI (docker + build + config + MCP + hook + specs)
    deps:
      - docker:up
      - build
    cmds:
      - mkdir -p "{{.CONFIG_DIR}}" && chmod 700 "{{.CONFIG_DIR}}"
      - |
        if [ ! -f "{{.CONFIG_DIR}}/config.toml" ]; then
          cp config/default.toml "{{.CONFIG_DIR}}/config.toml"
          chmod 600 "{{.CONFIG_DIR}}/config.toml"
          echo "Config copied to {{.CONFIG_DIR}}/config.toml"
        else
          echo "Config already exists at {{.CONFIG_DIR}}/config.toml"
        fi
      - |
        if [ -z "$MNEMOIR_REDIS_PASSWORD" ]; then
          echo "WARNING: MNEMOIR_REDIS_PASSWORD is not set. Set it before starting Redis."
        fi
      - task: prewarm
      - task: mcp:codex
      - task: hook:codex
      - task: specs:codex
      - echo ""
      - echo "Setup complete. Edit {{.CONFIG_DIR}}/config.toml to customize."

  mcp:codex:
    desc: Register MCP server with Codex CLI
    deps: [build]
    cmds:
      - '"{{.BASH}}" ./scripts/install-mcp-codex.sh {{.ROOT_DIR}}/{{.BIN_DIR}}/{{.BINARY}}'

  hook:codex:
    desc: Install Codex CLI Stop hook
    cmds:
      - '"{{.BASH}}" ./scripts/install-hook-codex.sh {{.ROOT_DIR}}/scripts/session-end-hook.sh'

  specs:codex:
    desc: Install agent specs into ~/.codex/AGENTS.md
    cmds:
      - '"{{.BASH}}" ./scripts/install-specs-codex.sh {{.ROOT_DIR}}/docs/agent-specs.md'

  # ---------------------------------------------------------------------------
  # Backup / Restore
  # ---------------------------------------------------------------------------
  backup:
    desc: "Hot backup Redis data dir via BGSAVE"
    cmds:
      - '"{{.BASH}}" ./scripts/backup-native.sh "{{.OUTPUT | default (printf "%s/backups/%s" .CONFIG_DIR (now | date "20060102"))}}"'

  restore:
    desc: Cold restore Redis data dir (INPUT=path/to/backup-dir)
    preconditions:
      - sh: '[ -n "{{.INPUT}}" ]'
        msg: "Usage: task restore INPUT=path/to/backup-dir"
    cmds:
      - '"{{.BASH}}" ./scripts/restore-native.sh {{.INPUT}}'

  backup:json:
    desc: "Dump all memories to JSON"
    deps: [build]
    cmds:
      - '{{.BIN_DIR}}/{{.BINARY}} backup --config "{{.CONFIG_DIR}}/config.toml" --output "{{.OUTPUT | default (printf "%s/backups/%s.json" .CONFIG_DIR (now | date "20060102"))}}"'

  restore:json:
    desc: Restore memories from JSON (INPUT=path/to/backup.json)
    deps: [build]
    preconditions:
      - sh: '[ -n "{{.INPUT}}" ]'
        msg: "Usage: task restore:json INPUT=path/to/backup.json"
    cmds:
      - '{{.BIN_DIR}}/{{.BINARY}} restore --config "{{.CONFIG_DIR}}/config.toml" --input {{.INPUT}}'

  # ---------------------------------------------------------------------------
  # Cleanup
  # ---------------------------------------------------------------------------
  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf {{.BIN_DIR}}

  clean:data:
    desc: Stop Redis and wipe all stored memories (data/)
    deps: [docker:down]
    cmds:
      - rm -rf data/
      - echo "Redis data wiped. Run 'task docker:up' to start fresh."
